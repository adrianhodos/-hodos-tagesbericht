<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17365d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Hodos Bericht">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Hodos Tagesbericht</title>
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#16283e;background:#edf2f7}*{box-sizing:border-box}body{margin:0;padding:16px}main{max-width:650px;margin:auto}.panel{background:#fff;padding:20px;border-radius:16px;box-shadow:0 5px 24px #17365d12;margin:14px 0}h1{font-size:1.6rem;color:#17365d;margin:0 0 8px}h2{font-size:1.12rem;color:#17365d}label{display:block;font-weight:600;margin:13px 0 5px}input,select,textarea,button{font:inherit}input:not([type=checkbox]),select,textarea{width:100%;padding:12px;border:1px solid #b6c5d4;border-radius:9px;background:white}textarea{min-height:90px}button{border:0;background:#17365d;color:#fff;padding:13px 16px;border-radius:9px;font-weight:700;cursor:pointer}button.secondary{background:#e5edf6;color:#17365d}button:disabled{opacity:.6}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.checks label{display:flex;gap:10px;align-items:center;padding:10px;background:#f2f6fa;border-radius:9px;font-weight:500}.checks input{width:21px;height:21px}.muted{color:#62758a;font-size:.9rem}.error{color:#a61d24}.success{color:#136d42}.hidden{display:none!important}.record{padding:12px;border-bottom:1px solid #e0e7ee;overflow-wrap:anywhere}.record:last-child{border:0}#status{min-height:24px;white-space:pre-wrap}header{margin-bottom:12px}
</style>
</head>
<body><main>
<header class="row"><div><h1>🚚 Hodos Tagesbericht</h1><div class="muted">Raport zilnic / Täglicher Fahrerbericht</div></div><button id="lang" class="secondary" type="button">RO / DE</button></header>
<section id="loginBox" class="panel"><h2 data-ro="Autentificare șofer" data-de="Fahrer-Anmeldung">Autentificare șofer</h2><form id="loginForm"><label data-ro="E-mail" data-de="E-Mail">E-mail</label><input id="email" type="email" autocomplete="username" required><label data-ro="Parolă" data-de="Passwort">Parolă</label><input id="password" type="password" autocomplete="current-password" required><p><button type="submit" id="loginBtn" data-ro="Conectare" data-de="Anmelden">Conectare</button></p></form><p class="muted" data-ro="Folosește e-mailul și parola create în Supabase Auth." data-de="E-Mail und Passwort aus Supabase Auth verwenden.">Folosește e-mailul și parola create în Supabase Auth.</p></section>
<section id="appBox" class="hidden"><div class="panel row"><div><strong id="userName"></strong><div class="muted" id="userRole"></div></div><button class="secondary" id="logoutBtn" type="button" data-ro="Ieșire" data-de="Abmelden">Ieșire</button></div>
<section class="panel"><h2 data-ro="Raport nou" data-de="Neuer Tagesbericht">Raport nou</h2><form id="reportForm"><label data-ro="Data" data-de="Datum">Data</label><input id="report_date" type="date" required><label data-ro="Număr camion" data-de="LKW-Kennzeichen">Număr camion</label><input id="truck_plate" maxlength="30" placeholder="SEF-HA 23" required><label data-ro="Tură / rută" data-de="Tour / Route">Tură / rută</label><input id="route_name" maxlength="150" required><div class="grid"><div><label data-ro="Km plecare" data-de="KM Start">Km plecare</label><input id="km_start" type="number" min="0" step="1" required></div><div><label data-ro="Km sosire" data-de="KM Ende">Km sosire</label><input id="km_end" type="number" min="0" step="1" required></div></div><label data-ro="Pauză (minute)" data-de="Pause (Minuten)">Pauză (minute)</label><input id="break_minutes" type="number" min="0" max="1440" step="1" value="0" required><div class="checks"><label><input type="checkbox" id="oil_checked"><span data-ro="Ulei verificat" data-de="Öl kontrolliert">Ulei verificat</span></label><label><input type="checkbox" id="tires_checked"><span data-ro="Anvelope verificate" data-de="Reifen kontrolliert">Anvelope verificate</span></label><label><input type="checkbox" id="lights_checked"><span data-ro="Lumini verificate" data-de="Beleuchtung kontrolliert">Lumini verificate</span></label></div><label data-ro="Observații / defecte" data-de="Bemerkungen / Mängel">Observații / defecte</label><textarea id="notes" maxlength="2000"></textarea><p><button id="saveBtn" type="submit" data-ro="Salvează raportul" data-de="Bericht speichern">Salvează raportul</button></p></form></section>
<section class="panel"><div class="row"><h2 data-ro="Rapoarte recente" data-de="Letzte Berichte">Rapoarte recente</h2><button type="button" class="secondary" id="refreshBtn" data-ro="Actualizează" data-de="Aktualisieren">Actualizează</button></div><div id="reports"></div></section></section>
<section class="panel"><div id="status" role="status" aria-live="polite"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
'use strict';
const URL_SUPABASE='https://gfjxjmrtigjlrsnjtogd.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_s4VVdzxCvPijzmZpijX7dQ_KUndER0s';
const $=id=>document.getElementById(id);
let db=null,sessionUser=null,profile=null,language=localStorage.getItem('hodos-language')||'ro';
const t=(ro,de)=>language==='ro'?ro:de;
function status(message,type=''){const e=$('status');e.textContent=message;e.className=type;}
function translate(){document.documentElement.lang=language;document.querySelectorAll('[data-ro][data-de]').forEach(e=>e.textContent=e.dataset[language]);$('lang').textContent=language==='ro'?'Deutsch':'Română';}
$('lang').addEventListener('click',()=>{language=language==='ro'?'de':'ro';localStorage.setItem('hodos-language',language);translate();if(sessionUser)loadReports();});
function todayLocal(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
$('report_date').value=todayLocal();
function showApp(logged){$('loginBox').classList.toggle('hidden',logged);$('appBox').classList.toggle('hidden',!logged);}
async function refreshSession(){const {data:{user},error}=await db.auth.getUser();if(error||!user){sessionUser=null;profile=null;showApp(false);return;}sessionUser=user;const result=await db.from('profiles').select('full_name,role').eq('id',user.id).maybeSingle();if(result.error){status(t('Nu pot încărca profilul: ','Profil konnte nicht geladen werden: ')+result.error.message,'error');showApp(false);return;}if(!result.data){status(t('Profilul utilizatorului lipsește. Contactează administratorul.','Benutzerprofil fehlt. Administrator kontaktieren.'),'error');showApp(false);return;}profile=result.data;$('userName').textContent=profile.full_name||user.email;$('userRole').textContent=profile.role==='admin'?'Administrator':t('Șofer','Fahrer');showApp(true);await loadReports();}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!db)return;const btn=$('loginBtn');btn.disabled=true;status(t('Se conectează…','Anmeldung läuft…'));try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';await refreshSession();status(t('Conectat.','Angemeldet.'),'success');}catch(err){status(t('Eroare la conectare: ','Anmeldefehler: ')+err.message,'error');}finally{btn.disabled=false;}});
$('logoutBtn').addEventListener('click',async()=>{const {error}=await db.auth.signOut();if(error)status(error.message,'error');else{sessionUser=null;profile=null;showApp(false);status(t('Deconectat.','Abgemeldet.'));}});
$('reportForm').addEventListener('submit',async e=>{e.preventDefault();if(!sessionUser)return;const kmStart=Number($('km_start').value),kmEnd=Number($('km_end').value),breakMinutes=Number($('break_minutes').value);if(!Number.isSafeInteger(kmStart)||!Number.isSafeInteger(kmEnd)||kmEnd<kmStart){status(t('Km sosire trebuie să fie cel puțin egal cu km plecare.','KM Ende muss mindestens KM Start entsprechen.'),'error');return;}if(!Number.isSafeInteger(breakMinutes)||breakMinutes<0){status(t('Verifică durata pauzei.','Pausendauer prüfen.'),'error');return;}const record={driver_id:sessionUser.id,report_date:$('report_date').value,truck_plate:$('truck_plate').value.trim(),route_name:$('route_name').value.trim(),km_start:kmStart,km_end:kmEnd,break_minutes:breakMinutes,oil_checked:$('oil_checked').checked,tires_checked:$('tires_checked').checked,lights_checked:$('lights_checked').checked,notes:$('notes').value.trim()};if(!record.truck_plate||!record.route_name){status(t('Completează camionul și ruta.','Kennzeichen und Tour eingeben.'),'error');return;}const btn=$('saveBtn');btn.disabled=true;status(t('Se salvează…','Wird gespeichert…'));try{const {error}=await db.from('daily_reports').insert(record);if(error)throw error;status(t('Raport salvat cu succes!','Bericht erfolgreich gespeichert!'),'success');$('reportForm').reset();$('report_date').value=todayLocal();$('break_minutes').value='0';await loadReports();}catch(err){status(t('Nu s-a salvat: ','Nicht gespeichert: ')+err.message,'error');}finally{btn.disabled=false;}});
$('refreshBtn').addEventListener('click',loadReports);
async function loadReports(){if(!sessionUser)return;const area=$('reports');area.textContent=t('Se încarcă…','Lädt…');let query=db.from('daily_reports').select('report_date,truck_plate,route_name,km_start,km_end,break_minutes,notes,created_at,driver_id').order('created_at',{ascending:false}).limit(30);if(profile?.role!=='admin')query=query.eq('driver_id',sessionUser.id);const {data,error}=await query;if(error){area.textContent=t('Eroare: ','Fehler: ')+error.message;return;}area.replaceChildren();if(!data?.length){area.textContent=t('Nu există rapoarte încă.','Noch keine Berichte.');return;}for(const r of data){const el=document.createElement('div');el.className='record';const strong=document.createElement('strong');strong.textContent=`${r.report_date} · ${r.truck_plate}`;const line=document.createElement('div');line.textContent=`${r.route_name} · ${r.km_start}–${r.km_end} km (${r.km_end-r.km_start} km) · ${r.break_minutes} min`;const note=document.createElement('div');note.className='muted';note.textContent=r.notes||'';el.append(strong,line,note);area.append(el);}}
(async()=>{translate();if(!window.supabase?.createClient){status(t('Biblioteca Supabase nu s-a încărcat. Verifică internetul.','Supabase-Bibliothek nicht geladen. Internet prüfen.'),'error');return;}db=window.supabase.createClient(URL_SUPABASE,PUBLISHABLE_KEY);await refreshSession();db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){sessionUser=null;profile=null;showApp(false);}});})().catch(e=>status(e.message,'error'));
</script>
</body></html>
