<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17365d">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Hodos Tagesbericht</title>
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#16283e;background:#edf2f7}
*{box-sizing:border-box}body{margin:0;padding:16px}main{max-width:650px;margin:auto}
.panel{background:#fff;padding:20px;border-radius:16px;box-shadow:0 5px 24px #17365d12;margin:14px 0}
h1{font-size:1.6rem;color:#17365d;margin:0 0 8px}h2{font-size:1.12rem;color:#17365d}
label{display:block;font-weight:600;margin:13px 0 5px}input,textarea,button{font:inherit}
input:not([type=checkbox]),textarea{width:100%;padding:12px;border:1px solid #b6c5d4;border-radius:9px;background:#fff}
textarea{min-height:90px}button{border:0;background:#17365d;color:white;padding:13px 16px;border-radius:9px;font-weight:700;cursor:pointer}
button.secondary{background:#e5edf6;color:#17365d}button.danger{background:#136d42}button:disabled{opacity:.55}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.checks label{display:flex;gap:10px;align-items:center;padding:10px;background:#f2f6fa;border-radius:9px;font-weight:500}
.checks input{width:21px;height:21px}.muted{color:#62758a;font-size:.9rem}.error{color:#a61d24}
.success{color:#136d42}.hidden{display:none!important}.record{padding:12px;border-bottom:1px solid #e0e7ee;overflow-wrap:anywhere}
.record:last-child{border:0}#status{min-height:24px;white-space:pre-wrap}header{margin-bottom:12px}
</style>
</head>
<body>
<main>
<header class="row"><div><h1>🚚 Hodos Tagesbericht</h1><div class="muted">Raport zilnic / Täglicher Fahrerbericht</div></div><button id="lang" class="secondary" type="button">RO / DE</button></header>
<section id="loginBox" class="panel">
<h2 data-ro="Autentificare șofer" data-de="Fahrer-Anmeldung">Autentificare șofer</h2>
<form id="loginForm"><label>E-mail</label><input id="email" type="email" autocomplete="username" required>
<label data-ro="Parolă" data-de="Passwort">Parolă</label><input id="password" type="password" autocomplete="current-password" required>
<p><button type="submit" id="loginBtn" data-ro="Conectare" data-de="Anmelden">Conectare</button></p></form>
</section>
<section id="appBox" class="hidden">
<div class="panel row"><div><strong id="userName"></strong><div class="muted" id="userRole"></div></div><button class="secondary" id="logoutBtn" type="button" data-ro="Ieșire" data-de="Abmelden">Ieșire</button></div>
<section class="panel">
<h2 data-ro="Tura în curs" data-de="Laufende Tour">Tura în curs</h2>
<div class="muted" id="draftState"></div>
<div class="muted" id="workTimeStatus"></div>
<form id="reportForm">
<label data-ro="Data" data-de="Datum">Data</label><input id="report_date" type="date" required>
<label data-ro="Număr camion" data-de="LKW-Kennzeichen">Număr camion</label><input id="truck_plate" maxlength="30" placeholder="SEF-HA 23" required>
<label data-ro="Tură / rută" data-de="Tour / Route">Tură / rută</label><input id="route_name" maxlength="150" required>
<div class="grid"><div><label data-ro="Km plecare" data-de="KM Start">Km plecare</label><input id="km_start" type="number" min="0" step="1" required></div><div><label data-ro="Km sosire" data-de="KM Ende">Km sosire</label><input id="km_end" type="number" min="0" step="1"></div></div>
<label data-ro="Pauză (minute)" data-de="Pause (Minuten)">Pauză (minute)</label><input id="break_minutes" type="number" min="0" max="1440" step="1">
<label data-ro="Motorină alimentată (litri)" data-de="Getankt (Liter)">Motorină alimentată (litri)</label><input id="fuel_liters" type="number" min="0" step="0.01" placeholder="0">
<label data-ro="AdBlue alimentat (litri)" data-de="AdBlue nachgefüllt (Liter)">AdBlue alimentat (litri)</label><input id="adblue_liters" type="number" min="0" step="0.01" placeholder="0">
<div class="checks"><label><input type="checkbox" id="oil_checked"><span data-ro="Ulei verificat" data-de="Öl kontrolliert">Ulei verificat</span></label>
<label><input type="checkbox" id="tires_checked"><span data-ro="Anvelope verificate" data-de="Reifen kontrolliert">Anvelope verificate</span></label>
<label><input type="checkbox" id="lights_checked"><span data-ro="Lumini verificate" data-de="Beleuchtung kontrolliert">Lumini verificate</span></label></div>
<label data-ro="Observații / defecte" data-de="Bemerkungen / Mängel">Observații / defecte</label><textarea id="notes" maxlength="2000"></textarea>
<p class="row"><button id="saveBtn" type="submit" data-ro="Salvează progresul" data-de="Zwischenstand speichern">Salvează progresul</button><button id="finishBtn" class="danger" type="button" data-ro="Finalizează tura" data-de="Tour abschließen">Finalizează tura</button></p>
</form></section>
<section class="panel"><div class="row"><h2 data-ro="Rapoarte recente" data-de="Letzte Berichte">Rapoarte recente</h2><button type="button" class="secondary" id="refreshBtn" data-ro="Actualizează" data-de="Aktualisieren">Actualizează</button></div><div id="reports"></div></section>
</section>
<section class="panel"><div id="status" role="status" aria-live="polite"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
'use strict';
const URL_SUPABASE='https://gfjxjmrtigjlrsnjtogd.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_s4VVdzxCvPijzmZpijX7dQ_KUndER0s';
const $=id=>document.getElementById(id);
let db=null,user=null,profile=null,openId=null,loading=false,dirty=false,busy=false;
let language=localStorage.getItem('hodos-language')||'ro';
let currentWorkStart=null,currentWorkEnd=null;
const t=(ro,de)=>language==='ro'?ro:de;
function status(s,type=''){$('status').textContent=s;$('status').className=type;}
function formatWorkTime(value){if(!value)return '—';return new Date(value).toLocaleString(language==='ro'?'ro-RO':'de-DE',{dateStyle:'short',timeStyle:'short',hour12:false});}
function showWorkTime(){
  $('workTimeStatus').textContent=currentWorkStart?
    t('Început program: ','Arbeitsbeginn: ')+formatWorkTime(currentWorkStart)+
    (currentWorkEnd?' · '+t('Sfârșit program: ','Arbeitsende: ')+formatWorkTime(currentWorkEnd):''):
    t('Ora începerii se înregistrează la prima salvare online.','Arbeitsbeginn wird beim ersten Online-Speichern erfasst.');
}
function translate(){document.documentElement.lang=language;document.querySelectorAll('[data-ro][data-de]').forEach(el=>el.textContent=el.dataset[language]);$('lang').textContent=language==='ro'?'Deutsch':'Română';showWorkTime();}
$('lang').onclick=()=>{language=language==='ro'?'de':'ro';localStorage.setItem('hodos-language',language);translate();if(user)loadReports();};
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function showApp(ok){$('loginBox').classList.toggle('hidden',ok);$('appBox').classList.toggle('hidden',!ok);}
const fieldIds=['report_date','truck_plate','route_name','km_start','km_end','break_minutes','fuel_liters','adblue_liters','oil_checked','tires_checked','lights_checked','notes'];
function localKey(){return 'hodos-draft-'+user.id;}
function readForm(){const o={};for(const id of fieldIds){const el=$(id);o[id]=el.type==='checkbox'?el.checked:el.value;}return o;}
function fillForm(o){loading=true;for(const id of fieldIds){if(o[id]===undefined||o[id]===null)continue;const el=$(id);if(el.type==='checkbox')el.checked=!!o[id];else el.value=String(o[id]);}loading=false;}
function resetForm(){loading=true;$('reportForm').reset();$('report_date').value=today();$('break_minutes').value='0';loading=false;dirty=false;}
function saveLocal(){if(!user||loading)return;try{localStorage.setItem(localKey(),JSON.stringify({data:readForm(),openId,updated:Date.now()}));$('draftState').textContent=t('Datele sunt păstrate pe acest telefon până la salvarea online.','Daten werden auf diesem Gerät bis zur Online-Speicherung aufbewahrt.');}catch(e){status(t('Nu pot salva local: ','Lokales Speichern fehlgeschlagen: ')+e.message,'error');}}
function restoreLocal(){try{const raw=localStorage.getItem(localKey());if(raw){const saved=JSON.parse(raw);if(saved?.data){fillForm(saved.data);dirty=true;}}}catch(e){status(e.message,'error');}}
function valueInt(id,required=false){const v=$(id).value;if(v===''){if(required)throw Error(t('Completează ','Bitte ausfüllen: ')+id);return null;}const n=Number(v);if(!Number.isSafeInteger(n)||n<0)throw Error(t('Valoare invalidă: ','Ungültiger Wert: ')+id);return n;}
function makeRecord(finalize=false){
  const kmStart=valueInt('km_start',true),kmEnd=valueInt('km_end',finalize),breakMinutes=valueInt('break_minutes',finalize);
  if(kmEnd!==null&&kmEnd<kmStart)throw Error(t('Km sosire nu poate fi mai mic decât km plecare.','KM Ende darf nicht kleiner als KM Start sein.'));
  if(breakMinutes!==null&&breakMinutes>1440)throw Error(t('Pauza este prea mare.','Pause ist zu lang.'));
  const liters=$('fuel_liters').value.trim(),fuel=liters===''?null:Number(liters);
  if(fuel!==null&&(!Number.isFinite(fuel)||fuel<0))throw Error(t('Cantitate motorină invalidă.','Ungültige Kraftstoffmenge.'));
  const adblueInput=$('adblue_liters').value.trim(),adblue=adblueInput===''?null:Number(adblueInput);
  if(adblue!==null&&(!Number.isFinite(adblue)||adblue<0))throw Error(t('Cantitate AdBlue invalidă.','Ungültige AdBlue-Menge.'));
  const rec={driver_id:user.id,report_date:$('report_date').value,truck_plate:$('truck_plate').value.trim(),route_name:$('route_name').value.trim(),km_start:kmStart,km_end:kmEnd,break_minutes:breakMinutes,fuel_liters:fuel,adblue_liters:adblue,oil_checked:$('oil_checked').checked,tires_checked:$('tires_checked').checked,lights_checked:$('lights_checked').checked,notes:$('notes').value.trim()};
  if(!rec.report_date||!rec.truck_plate||!rec.route_name)throw Error(t('Completează data, camionul și ruta.','Datum, Kennzeichen und Tour ausfüllen.'));
  return rec;
}
async function findOpen(){const {data,error}=await db.from('daily_reports').select('*').eq('driver_id',user.id).eq('is_finalized',false).order('created_at',{ascending:false}).limit(1);if(error)throw error;return data?.[0]||null;}
async function restoreDraft(){
  resetForm();openId=null;currentWorkStart=null;currentWorkEnd=null;
  const remote=await findOpen();
  if(remote){openId=remote.id;fillForm(remote);currentWorkStart=remote.work_started_at;currentWorkEnd=remote.work_ended_at;$('draftState').textContent=t('Tură deschisă, salvată online.','Offene Tour, online gespeichert.');}
  else{restoreLocal();$('draftState').textContent=t('Tură nouă. Completează datele de plecare.','Neue Tour. Startdaten eingeben.');}
  showWorkTime();
}
async function refreshSession(){
  const result=await db.auth.getUser(),u=result.data?.user;
  if(result.error||!u){user=null;profile=null;showApp(false);return;}
  user=u;
  const p=await db.from('profiles').select('full_name,role').eq('id',u.id).maybeSingle();
  if(p.error||!p.data){showApp(false);status(t('Profil indisponibil: ','Profil nicht verfügbar: ')+(p.error?.message||'lipsă'),'error');return;}
  profile=p.data;$('userName').textContent=profile.full_name||u.email;$('userRole').textContent=profile.role==='admin'?'Administrator':t('Șofer','Fahrer');showApp(true);
  try{await restoreDraft();}catch(e){restoreLocal();status(t('Nu pot încărca tura online: ','Online-Tour konnte nicht geladen werden: ')+e.message,'error');}
  await loadReports();
}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';await refreshSession();if(profile)status(t('Conectat.','Angemeldet.'),'success');}catch(err){status(err.message,'error');}finally{$('loginBtn').disabled=false;}};
$('logoutBtn').onclick=async()=>{if(user)saveLocal();const {error}=await db.auth.signOut();if(error){status(error.message,'error');return;}user=null;profile=null;openId=null;currentWorkStart=null;currentWorkEnd=null;showApp(false);status(t('Deconectat.','Abgemeldet.'));};
$('reportForm').addEventListener('input',()=>{dirty=true;saveLocal();});
$('reportForm').addEventListener('change',()=>{dirty=true;saveLocal();});
async function readWorkTime(id){
  const {data,error}=await db.from('daily_reports').select('work_started_at,work_ended_at,is_finalized').eq('id',id).eq('driver_id',user.id).single();
  if(error)throw error;
  currentWorkStart=data.work_started_at;currentWorkEnd=data.work_ended_at;showWorkTime();
  return data;
}
async function saveProgress(finalize=false){
  if(!user||busy)return;
  busy=true;$('saveBtn').disabled=true;$('finishBtn').disabled=true;
  try{
    const rec=makeRecord(finalize);
    if(finalize&&!openId)throw Error(t('Salvează mai întâi progresul pentru a înregistra începutul programului.','Zuerst den Zwischenstand speichern, um den Arbeitsbeginn zu erfassen.'));
    if(finalize&&!confirm(t('Finalizezi tura? După finalizare raportul nu mai poate fi modificat.','Tour abschließen? Danach kann der Bericht nicht mehr geändert werden.')))return;
    let result;
    if(openId){
      result=await db.from('daily_reports').update(rec).eq('id',openId).eq('driver_id',user.id).eq('is_finalized',false).select('id').single();
    }else{
      result=await db.from('daily_reports').insert({...rec,is_finalized:false}).select('id').single();
    }
    if(result.error)throw result.error;
    openId=result.data.id;
    let times=await readWorkTime(openId);
    if(!times.work_started_at){
      const {error}=await db.rpc('start_work',{p_report_id:openId});
      if(error)throw error;
      times=await readWorkTime(openId);
    }
    if(finalize){
      if(!times.work_ended_at){
        const {error}=await db.rpc('end_work',{p_report_id:openId});
        if(error)throw error;
        times=await readWorkTime(openId);
      }
      const {data:finished,error:finalError}=await db.from('daily_reports').update({is_finalized:true}).eq('id',openId).eq('driver_id',user.id).eq('is_finalized',false).select('id').single();
      if(finalError)throw finalError;
      if(!finished)throw Error(t('Finalizarea nu a fost confirmată.','Abschluss nicht bestätigt.'));
      openId=null;currentWorkStart=null;currentWorkEnd=null;
      localStorage.removeItem(localKey());resetForm();showWorkTime();
      $('draftState').textContent=t('Tura a fost finalizată.','Tour abgeschlossen.');
      status(t('Ora terminării a fost salvată. Raport finalizat și blocat.','Arbeitsende gespeichert. Bericht abgeschlossen und gesperrt.'),'success');
    }else{
      dirty=false;saveLocal();
      $('draftState').textContent=t('Progres salvat online.','Zwischenstand online gespeichert.');
      status(t('Progres și ora începerii salvate online.','Zwischenstand und Arbeitsbeginn online gespeichert.'),'success');
    }
    await loadReports();
  }catch(err){
    saveLocal();
    status(t('Eroare la salvare: ','Fehler beim Speichern: ')+err.message,'error');
  }finally{busy=false;$('saveBtn').disabled=false;$('finishBtn').disabled=false;}
}
$('reportForm').onsubmit=e=>{e.preventDefault();saveProgress(false);};
$('finishBtn').onclick=()=>saveProgress(true);
$('refreshBtn').onclick=loadReports;
async function loadReports(){
  if(!user)return;
  const area=$('reports');area.textContent=t('Se încarcă…','Lädt…');
  let q=db.from('daily_reports').select('*').order('created_at',{ascending:false}).limit(30);
  if(profile?.role!=='admin')q=q.eq('driver_id',user.id);
  const {data,error}=await q;
  if(error){area.textContent='Eroare: '+error.message;return;}
  area.replaceChildren();
  if(!data?.length){area.textContent=t('Nu există rapoarte.','Keine Berichte.');return;}
  const names={};
  if(profile?.role==='admin'){
    const ids=[...new Set(data.map(r=>r.driver_id))];
    const res=await db.from('profiles').select('id,full_name').in('id',ids);
    if(!res.error)for(const p of res.data||[])names[p.id]=p.full_name;
  }
  for(const r of data){
    const d=document.createElement('details');d.className='record';
    const s=document.createElement('summary');
    const name=names[r.driver_id]||(r.driver_id===user.id?profile.full_name:t('Șofer necunoscut','Fahrer unbekannt'));
    s.textContent=`${r.report_date} · ${r.truck_plate} · ${name} · ${r.is_finalized?t('Finalizat','Abgeschlossen'):t('În curs','Offen')}`;
    d.append(s);
    const fields=[
      [t('Șofer','Fahrer'),name],
      [t('Rută','Tour'),r.route_name],
      [t('Început program','Arbeitsbeginn'),formatWorkTime(r.work_started_at)],
      [t('Sfârșit program','Arbeitsende'),formatWorkTime(r.work_ended_at)],
      [t('Km plecare','KM Start'),r.km_start],
      [t('Km sosire','KM Ende'),r.km_end],
      [t('Km parcurși','Gefahrene KM'),r.km_end==null?'—':r.km_end-r.km_start],
      [t('Pauză','Pause'),`${r.break_minutes??'—'} min`],
      [t('Motorină (litri)','Getankt (Liter)'),r.fuel_liters],
      [t('AdBlue (litri)','AdBlue (Liter)'),r.adblue_liters],
      [t('Ulei verificat','Öl geprüft'),r.oil_checked],
      [t('Anvelope verificate','Reifen geprüft'),r.tires_checked],
      [t('Lumini verificate','Licht geprüft'),r.lights_checked],
      [t('Observații','Bemerkungen'),r.notes||'—']
    ];
    for(const [label,val] of fields){
      const line=document.createElement('div');line.style.padding='7px 0';
      line.textContent=label+': '+(typeof val==='boolean'?(val?'✓ Da / Ja':'✗ Nu / Nein'):String(val??'—'));
      d.append(line);
    }
    if(profile?.role==='admin'){
      const btn=document.createElement('button');btn.type='button';
      btn.textContent=t('Șterge raport','Bericht löschen');btn.style.background='#b42318';btn.style.marginTop='12px';
      btn.onclick=async()=>{
        if(!confirm(t('Ștergi definitiv acest raport?','Bericht endgültig löschen?')))return;
        const {data:deleted,error:deleteError}=await db.from('daily_reports').delete().eq('id',r.id).select('id');
        if(deleteError){alert(deleteError.message);return;}
        if(!deleted?.length){alert(t('Raportul nu a fost șters.','Bericht wurde nicht gelöscht.'));return;}
        if(openId===r.id){openId=null;await restoreDraft();}
        await loadReports();
      };
      d.append(btn);
    }
    area.append(d);
  }
}
(async()=>{
  translate();
  if(!window.supabase?.createClient)throw Error(t('Biblioteca Supabase nu s-a încărcat.','Supabase-Bibliothek nicht geladen.'));
  db=window.supabase.createClient(URL_SUPABASE,PUBLISHABLE_KEY);
  await refreshSession();
  db.auth.onAuthStateChange(event=>{
    if(event==='SIGNED_OUT'){user=null;profile=null;showApp(false);}
    if(event==='PASSWORD_RECOVERY'){
      setTimeout(async()=>{
        const pwd=prompt(t('Parola nouă (minimum 8 caractere):','Neues Passwort (mindestens 8 Zeichen):'));
        if(!pwd)return;
        if(pwd.length<8){alert(t('Minimum 8 caractere.','Mindestens 8 Zeichen.'));return;}
        const {error}=await db.auth.updateUser({password:pwd});
        alert(error?error.message:t('Parola a fost schimbată.','Passwort geändert.'));
      },0);
    }
  });
})().catch(e=>status(e.message,'error'));
</script>
</body>
</html>
